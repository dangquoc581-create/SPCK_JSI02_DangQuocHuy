<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn | HuyChat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <!-- ! Điều hướng -->
    <nav class="navbar hc-navbar sticky-top border-bottom">
        <div class="container">
            <a
                class="navbar-brand d-flex align-items-center gap-2 hc-brand"
                href="index.html"
            >
                <span class="hc-logo">H</span>
                HuyChat
            </a>

            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-light" href="index.html">
                    Trang chủ
                </a>
                <a class="btn btn-sm btn-light" href="profile.html">
                    Hồ sơ
                </a>
                <button
                    class="btn btn-sm btn-outline-secondary"
                    data-sign-out
                >
                    Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <!-- ! Giao diện trò chuyện minh họa -->
    <main class="container py-4">
        <div class="card hc-card overflow-hidden">
            <div class="row g-0">

                <!-- ! Tìm kiếm và danh sách cuộc trò chuyện -->
                <aside class="col-lg-4 border-end">
                    <div class="p-3 border-bottom">
                        <h1 class="h5 fw-bold">
                            Tin nhắn
                        </h1>

                        <label
                            class="visually-hidden"
                            for="conversation-search"
                        >
                            Tìm kiếm cuộc trò chuyện
                        </label>

                        <input
                            id="conversation-search"
                            class="form-control"
                            type="search"
                            placeholder="Tìm kiếm cuộc trò chuyện"
                        >
                    </div>

                    <div class="list-group list-group-flush hc-chat-list p-2">
                        <button
                            class="list-group-item list-group-item-action hc-chat-item active d-flex gap-3 align-items-center"
                        >
                            <span class="hc-avatar">
                                LA
                            </span>

                            <span class="flex-grow-1 text-start">
                                <strong class="d-block">
                                    Linh Anh
                                </strong>
                                <small class="hc-muted">
                                    Chúng mình bắt đầu nhé!
                                </small>
                            </span>

                            <span class="badge text-bg-primary rounded-pill">
                                2
                            </span>
                        </button>

                        <button
                            class="list-group-item list-group-item-action hc-chat-item d-flex gap-3 align-items-center"
                        >
                            <span class="hc-avatar">
                                MN
                            </span>

                            <span class="text-start">
                                <strong class="d-block">
                                    Minh Nguyễn
                                </strong>
                                <small class="hc-muted">
                                    Cảm ơn bạn nhiều.
                                </small>
                            </span>
                        </button>

                        <button
                            class="list-group-item list-group-item-action hc-chat-item d-flex gap-3 align-items-center"
                        >
                            <span class="hc-avatar">
                                TH
                            </span>

                            <span class="text-start">
                                <strong class="d-block">
                                    Tuấn Huy
                                </strong>
                                <small class="hc-muted">
                                    Hẹn bạn cuối tuần!
                                </small>
                            </span>
                        </button>
                    </div>
                </aside>

                <!-- ! Nội dung cuộc trò chuyện -->
                <section class="col-lg-8 d-flex flex-column">
                    <header class="d-flex align-items-center gap-3 p-3 border-bottom">
                        <span class="hc-avatar">
                            LA
                        </span>

                        <div>
                            <h2 class="h6 mb-0">
                                Linh Anh
                            </h2>
                            <small class="text-success">
                                ● Đang hoạt động
                            </small>
                        </div>

                        <button
                            class="btn btn-sm btn-light ms-auto"
                            aria-label="Xem thông tin Linh Anh"
                        >
                            ⓘ
                        </button>
                    </header>

                    <div class="hc-messages p-3 d-flex flex-column gap-3">
                        <div class="hc-bubble received">
                            Chào Huy, hôm nay bạn thế nào?
                        </div>

                        <div class="hc-bubble sent align-self-end">
                            Mình ổn, cảm ơn Linh! Mình đang hoàn thiện giao diện HuyChat.
                        </div>

                        <div class="hc-bubble received">
                            Tuyệt quá. Trông nó sẽ rất đẹp đấy!
                        </div>

                        <small class="hc-muted text-center">
                            Hôm nay, 10:24
                        </small>
                    </div>

                    <form class="p-3 border-top d-flex gap-2">
                        <label
                            class="visually-hidden"
                            for="message-input"
                        >
                            Nhập tin nhắn
                        </label>

                        <input
                            id="message-input"
                            class="form-control"
                            placeholder="Nhập tin nhắn..."
                            autocomplete="off"
                        >

                        <button
                            class="btn btn-hc"
                            type="submit"
                        >
                            Gửi
                        </button>
                    </form>
                </section>

            </div>
        </div>
    </main>

    <script
        type="module"
        src="app.js"
    ></script>
</body>
</html>
