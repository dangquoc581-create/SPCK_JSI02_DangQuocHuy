<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | HuyChat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <!-- ! Trang đăng nhập -->
    <main class="container py-4">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <section class="card hc-card auth-card">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <!-- <span class="hc-logo auth-logo">
                                H
                            </span> -->

                            <p class="small text-uppercase text-primary fw-semibold mt-3 mb-2">
                                Chào mừng trở lại
                            </p>

                            <h1 class="h2 fw-bold">
                                Đăng nhập HuyChat
                            </h1>

                            <p class="hc-muted mb-0">
                                Kết nối và chia sẻ cùng mọi người.
                            </p>
                        </div>

                        <!-- ! Form đăng nhập -->
                        <form id="logForm" novalidate>
                            <div class="mb-3">
                                <label
                                    class="form-label fw-medium"
                                    for="logMail"
                                >
                                    Email
                                </label>

                                <input
                                    class="form-control form-control-lg"
                                    type="email"
                                    id="logMail"
                                    autocomplete="email"
                                    placeholder="name@example.com"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label
                                    class="form-label fw-medium"
                                    for="logPass"
                                >
                                    Mật khẩu
                                </label>

                                <input
                                    class="form-control form-control-lg"
                                    type="password"
                                    id="logPass"
                                    autocomplete="current-password"
                                    placeholder="Nhập mật khẩu"
                                    required
                                >
                            </div>

                            <button
                                class="btn btn-hc btn-lg w-100"
                                type="submit"
                            >
                                Đăng nhập
                            </button>

                            <button
                                id="forgot-password"
                                class="btn btn-link w-100 mt-2 text-decoration-none"
                                type="button"
                            >
                                Quên mật khẩu?
                            </button>
                        </form>

                        <div
                            id="message"
                            class="mt-3"
                            role="alert"
                            aria-live="polite"
                        ></div>

                        <p class="text-center hc-muted mt-4 mb-0">
                            Chưa có tài khoản?
                            <a
                                class="fw-semibold text-decoration-none"
                                href="dangky.html"
                            >
                                Đăng ký ngay
                            </a>
                        </p>

                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- ! Xử lý đăng nhập với Firebase -->
    <script
        type="module"
        src="./auth.js"
    ></script>
</body>
</html>
